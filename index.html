
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshRoute - Proyecto Maestro Total</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS y JS (Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .gradient-text { background: linear-gradient(135deg, #22c55e, #0ea5e9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        @keyframes slideInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideInUp 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }

        .croquis-container { display: grid; grid-template-columns: 1.5fr 2fr 1.5fr; grid-template-rows: 150px 150px; gap: 12px; background: #e2e8f0; padding: 12px; border-radius: 16px; }
        .zone-btn { background: white; border: 2px solid transparent; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .zone-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .zone-btn.active { border-color: #22c55e; background: #f0fdf4; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2); }
        .zone-recepcion { grid-row: 1 / 3; } .zone-calidad { grid-column: 2 / 3; grid-row: 1 / 2; } .zone-frio { grid-column: 2 / 3; grid-row: 2 / 3; } .zone-despacho { grid-column: 3 / 4; grid-row: 1 / 3; } .zone-control { grid-column: 1 / 4; grid-row: 3 / 4; height: 80px; margin-top: 4px;}

        .canvas-box { background: white; border: 2px solid #e2e8f0; border-radius: 12px; padding: 16px; transition: all 0.2s; height: 100%; display: flex; flex-direction: column;}
        .canvas-box:hover { border-color: #22c55e; box-shadow: 0 10px 15px -3px rgba(34,197,94,0.1); transform: translateY(-2px); }
        .canvas-header { display: flex; align-items: center; gap: 8px; font-weight: 800; color: #1e293b; margin-bottom: 12px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
        .canvas-list { list-style: none; padding: 0; margin: 0; font-size: 0.85rem; color: #475569; }
        .canvas-list li { margin-bottom: 8px; padding-left: 16px; position: relative; }
        .canvas-list li::before { content: '•'; position: absolute; left: 0; color: #22c55e; font-weight: bold; }

        #map-container { height: 450px; width: 100%; border-radius: 1rem; z-index: 10; }
        .custom-div-icon { background: transparent; border: none; }
        .color-swatch { width: 100%; height: 80px; border-radius: 12px; margin-bottom: 10px; box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.06); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Table Styles */
        .fin-table th { background-color: #f1f5f9; color: #334155; font-weight: 800; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; padding: 12px 16px; text-align: left; }
        .fin-table td { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; color: #475569; font-size: 0.875rem; }
        .fin-table tr:hover { background-color: #f8fafc; }
        .fin-table .subtotal { font-weight: 700; color: #0f172a; background-color: #f1f5f9; }
        .fin-table .total { font-weight: 900; color: #22c55e; background-color: #f0fdf4; font-size: 1rem;}
    </style>
    <script>
        tailwind.config = { theme: { extend: { colors: { fresh: { green: '#22c55e', dark: '#0f172a', cyan: '#06b6d4', orange: '#f97316' } } } } }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ================= DATOS DEL PROYECTO =================

        // 1. MARCA
        const BRAND_COLORS = [
            { name: 'Fresh Green', hex: '#22C55E', class: 'bg-[#22C55E]', text: 'Sostenibilidad, frescura y agro.' },
            { name: 'Tech Slate', hex: '#0F172A', class: 'bg-[#0F172A]', text: 'Profesionalismo B2B, software y servidores.' },
            { name: 'Cold Cyan', hex: '#06B6D4', class: 'bg-[#06B6D4]', text: 'Cadena de frío y sensores IoT.' },
            { name: 'Alert Orange', hex: '#F97316', class: 'bg-[#F97316]', text: 'Dinamismo, alertas UI y alimentos.' }
        ];

        // 2. ADMIN
        const ADMIN_DATA = [
            { id: 'mision', icon: 'fa-bullseye', color: 'text-blue-500', bg: 'bg-blue-50', title: 'Misión', detail: 'Optimizar la distribución de alimentos frescos utilizando algoritmos de ruteo dinámico y telemetría IoT.' },
            { id: 'vision', icon: 'fa-eye', color: 'text-indigo-500', bg: 'bg-indigo-50', title: 'Visión', detail: 'Para el 2030, ser la plataforma logística e infraestructura tecnológica estándar en la distribución de perecederos en la región.' },
            { id: 'valores', icon: 'fa-heart', color: 'text-red-500', bg: 'bg-red-50', title: 'Valores', detail: '• Innovación\n• Calidad Estricta\n• Sostenibilidad Ambiental\n• Transparencia de Datos.' },
            { id: 'politicas', icon: 'fa-shield-halved', color: 'text-emerald-500', bg: 'bg-emerald-50', title: 'Políticas', detail: '1. Frío Ininterrumpido (Tolerancia 0).\n2. Comercio Justo (Cero intermediarios).\n3. Zero Waste (Donación de rechazos).' },
            { id: 'objetivos', icon: 'fa-flag-checkered', color: 'text-orange-500', bg: 'bg-orange-50', title: 'Objetivos', detail: '• Reducir Lead Time un 25%.\n• Mantener rechazo debajo del 0.8%.\n• Integrar 150 productores locales en 12 meses.' }
        ];

        // 3. TÉCNICO
        const ZONES_DATA = {
            recepcion: { name: '1. Muelles Inbound', icon: 'fa-truck-ramp-box', color: 'text-emerald-600', temp: '15°C', equip: 'Rampas, Básculas, RFID.', desc: 'Recepción del campo.' },
            calidad: { name: '2. Control Calidad', icon: 'fa-clipboard-check', color: 'text-blue-600', temp: '10°C', equip: 'Mesas INOX, Termómetros.', desc: 'Inspección y asignación QR.' },
            frio: { name: '3. Cuartos Fríos', icon: 'fa-snowflake', color: 'text-cyan-600', temp: '2°C - 6°C', equip: 'Drive-in racks, IoT.', desc: 'Cross-docking alta rotación.' },
            despacho: { name: '4. Muelles Outbound', icon: 'fa-truck-fast', color: 'text-orange-600', temp: '8°C', equip: 'Sellos inflables, Apiladores.', desc: 'Despacho urbano ligero.' },
            control: { name: '5. Control IT', icon: 'fa-server', color: 'text-purple-600', temp: '20°C', equip: 'Video Wall, Servidores Edge.', desc: 'Monitoreo de IA y algoritmos.' }
        };

        const MAQUINARIA_DATA = [
            { tipo: 'Primera Milla', icon: 'fa-truck', title: 'Camiones Pesados', specs: ['5-8 Toneladas.', 'Thermo King independiente.'] },
            { tipo: 'Última Milla', icon: 'fa-van-shuttle', title: 'Furgonetas Ligeras', specs: ['1-2 Toneladas.', 'Agilidad capilar urbana.'] },
            { tipo: 'Intralogística', icon: 'fa-pallet', title: 'Elevación', specs: ['Montacargas Eléctricos.', 'Apiladores Reach Trucks.'] },
            { tipo: 'Hardware/IoT', icon: 'fa-microchip', title: 'Tecnología', specs: ['Dataloggers 5G por palet.', 'Telemetría GPS (OBD2).'] }
        ];

        // 4. COMERCIAL
        const COMERCIAL_DATA = [
            { id: 'segmentacion', title: 'Segmentación', icon: 'fa-users-viewfinder', color: 'text-blue-500', bg: 'bg-blue-50', text: 'B2B: Productores Agrícolas sin logística propia, Cadenas Retail y HORECA.' },
            { id: 'tamano', title: 'Tamaño del Mercado', icon: 'fa-chart-pie', color: 'text-indigo-500', bg: 'bg-indigo-50', text: 'Océano Azul: Sector de billones de pesos donde se pierde hasta el 30% de comida por ineficiencias.' },
            { id: 'competencia', title: 'Competencia', icon: 'fa-chess-knight', color: 'text-red-500', bg: 'bg-red-50', text: 'Transporte informal y operadoras de carga seca que no dominan la cadena de frío.' },
            { id: 'tendencias', title: 'Tendencias', icon: 'fa-arrow-trend-up', color: 'text-orange-500', bg: 'bg-orange-50', text: 'Trazabilidad "Farm to Fork", digitalización agro y normativas ESG.' },
            { id: 'posicionamiento', title: 'Posicionamiento', icon: 'fa-crosshairs', color: 'text-emerald-500', bg: 'bg-emerald-50', text: '"Socio Tecnológico de la Cadena de Frío". Garantizamos frescura y protegemos reputación.' },
            { id: 'canales', title: 'Canales', icon: 'fa-network-wired', color: 'text-cyan-500', bg: 'bg-cyan-50', text: 'Venta B2B directa, Agroexpo, App Móvil (Productores) y Dashboard Web (Retail).' },
            { id: 'precio', title: 'Precio', icon: 'fa-tags', color: 'text-purple-500', bg: 'bg-purple-50', text: 'Modelo Híbrido: Tarifa transaccional por volumen/km + Suscripción (SaaS) premium.' }
        ];

        // 5. FINANCIERO
        const FINANCIERO_DATA = [
            { title: 'Ingresos y Ventas', icon: 'fa-money-bill-trend-up', color: 'text-emerald-600', text: 'Tarifa logística base por volumen transportado + Suscripción SaaS.' },
            { title: 'Costos Directos', icon: 'fa-truck-droplet', color: 'text-red-500', text: 'Combustible, mantenimiento, peajes y alto consumo eléctrico para frío.' },
            { title: 'Gastos Operativos', icon: 'fa-file-invoice', color: 'text-orange-500', text: 'Nómina, marketing B2B, e infraestructura de servidores Cloud (AWS).' },
            { title: 'Punto de Equilibrio', icon: 'fa-scale-balanced', color: 'text-blue-500', text: 'Proyectado al mes 14 con contratos fijos en 3 cadenas retail.' },
            { title: 'Utilidad Esperada', icon: 'fa-chart-line', color: 'text-green-500', text: 'EBITDA del 18-22% al tercer año gracias al escalamiento del software.' },
            { title: 'Inversión & Financiación', icon: 'fa-seedling', color: 'text-teal-600', text: 'Capital semilla para Hub y desarrollo SaaS (VC + Créditos comerciales).' },
            { title: 'Liquidez Empresarial', icon: 'fa-droplet', color: 'text-cyan-500', text: 'Factoring de facturas de retail a 60 días para pagar al campesino a 7 días.' },
            { title: 'Apalancamiento', icon: 'fa-arrow-up-right-dots', color: 'text-purple-500', text: 'Leasing Operativo para flota (OPEX) y créditos de "Banca Verde".' }
        ];

        // Novedad: Tabla Estado de Resultados
        const FINANCIAL_TABLE_DATA = [
            { id: 1, label: 'Ingresos Totales', value: '$ 4,500,000,000', type: 'normal' },
            { id: 2, label: '(-) Costes de Acopio / Hub', value: '$ 850,000,000', type: 'normal' },
            { id: 3, label: '(-) Costes Logística / Flota', value: '$ 1,600,000,000', type: 'normal' },
            { id: 4, label: '(-) Costes Calidad y Pérdidas', value: '$ 45,000,000', type: 'normal' },
            { id: 5, label: '(=) Margen Operativo', value: '$ 2,005,000,000', type: 'subtotal' },
            { id: 6, label: 'Ratio Margen sobre Ingresos', value: '44.5%', type: 'ratio' },
            { id: 7, label: '(-) Gastos de Marketing B2B', value: '$ 150,000,000', type: 'normal' },
            { id: 8, label: '(-) Gastos de Personal (Administrativo)', value: '$ 800,000,000', type: 'normal' },
            { id: 9, label: '(-) Gastos I+D (Desarrollo Algoritmos)', value: '$ 250,000,000', type: 'normal' },
            { id: 10, label: '(-) Gastos Generales y Cloud', value: '$ 120,000,000', type: 'normal' },
            { id: 11, label: '(=) Total Gastos de Estructura', value: '$ 1,320,000,000', type: 'subtotal' },
            { id: 12, label: 'Resultado Bruto (EBITDA)', value: '$ 685,000,000', type: 'subtotal' },
            { id: 13, label: 'Ratio Resultado Bruto s/ Ingresos', value: '15.2%', type: 'ratio' },
            { id: 14, label: 'Gastos de Depreciación (Equipos/Hub)', value: '$ 95,000,000', type: 'normal' },
            { id: 15, label: 'Gastos Financieros (Leasing/Créditos)', value: '$ 60,000,000', type: 'normal' },
            { id: 16, label: 'Resultado Neto Proyectado (Año 1)', value: '$ 530,000,000', type: 'total' }
        ];

        // 6. NUEVO: LEGAL
        const LEGAL_DATA = [
            { title: 'Reglamentaciones (Transporte y Alimentos)', icon: 'fa-scale-balanced', color: 'text-indigo-600', text: 'Cumplimiento de la Resolución 2674 de 2013 (INVIMA) sobre requisitos sanitarios y buenas prácticas de manipulación de alimentos. Asimismo, acatamiento del Decreto 1079 de 2015 del MinTransporte para logística terrestre.' },
            { title: 'Marco Legal Aplicable', icon: 'fa-gavel', color: 'text-slate-700', text: 'Operamos bajo el marco de las Sociedades por Acciones Simplificadas (S.A.S) en Colombia, con regulaciones específicas de contratos de transporte de carga y leyes de protección de datos (Ley 1581) para la plataforma SaaS.' },
            { title: 'Permisos, Licencias y Registros', icon: 'fa-file-signature', color: 'text-emerald-600', text: 'Concepto Sanitario Favorable expedido por Secretaría de Salud/INVIMA para los Hubs, Registro Nacional de Despachos de Carga (RNDC), permisos de uso de suelo comercial/industrial, y certificados de fumigación de la flota.' },
            { title: 'Efectos e Impactos Sociales', icon: 'fa-hands-holding-child', color: 'text-rose-500', text: 'Impacto positivo profundo: Reducción de la pobreza rural al garantizar comercio justo. Generación de empleo logístico formal y mitigación de la inseguridad alimentaria mediante el programa Zero Waste (Donación a fundaciones).' },
            { title: 'Responsabilidades', icon: 'fa-handshake-angle', color: 'text-amber-600', text: 'Responsabilidad Civil Extracontractual mediante pólizas para protección de mercancía y terceros. Responsabilidad Ambiental garantizando disposición adecuada de gases refrigerantes y residuos sólidos en el Hub.' }
        ];

        // ================= COMPONENTES VISUALES =================

        const Logo = () => (
            <svg className="w-10 h-10 md:w-12 md:h-12" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <g id="vegetables">
                    <circle cx="45" cy="70" r="25" fill="#ef4444" />
                    <path d="M45 45 C55 45 55 55 45 55 C35 55 35 45 45 45 Z" fill="#22c55e" />
                    <path d="M45 45 C45 35 35 35 35 45 C35 55 45 55 45 45 Z" fill="#22c55e" />
                    <path d="M65 30 Q105 40 100 80 Q90 105 65 30 Z" fill="#f97316" transform="rotate(20, 85, 55)" />
                </g>
                <path fill="none" stroke="white" strokeWidth="12" strokeLinecap="round" strokeLinejoin="round" d="M10 85 L 45 55 L 75 75 L 110 30" />
                <path fill="none" stroke="white" strokeWidth="12" strokeLinecap="round" strokeLinejoin="round" d="M85 30 L 110 30 L 110 55" />
                <path fill="none" stroke="#0f172a" strokeWidth="6" strokeLinecap="round" strokeLinejoin="round" d="M10 85 L 45 55 L 75 75 L 110 30" />
                <path fill="none" stroke="#0f172a" strokeWidth="6" strokeLinecap="round" strokeLinejoin="round" d="M85 30 L 110 30 L 110 55" />
            </svg>
        );

        const MapComponent = () => {
            const mapRef = useRef(null);
            useEffect(() => {
                if (!mapRef.current) {
                    const map = L.map('map-container').setView([4.5709, -74.2973], 6);
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);

                    const hubIcon = L.divIcon({ html: '<div class="w-8 h-8 bg-fresh-dark text-white rounded-full flex items-center justify-center shadow-lg"><i class="fa-solid fa-building"></i></div>', className: 'custom-div-icon', iconSize: [32, 32], iconAnchor: [16, 16] });
                    const agroIcon = L.divIcon({ html: '<div class="w-6 h-6 bg-fresh-green text-white rounded-full flex items-center justify-center shadow-md text-xs"><i class="fa-solid fa-leaf"></i></div>', className: 'custom-div-icon', iconSize: [24, 24], iconAnchor: [12, 12] });

                    L.marker([4.5339, -75.6811], {icon: hubIcon}).addTo(map).bindPopup('<b>Hub Central Quindío</b>');
                    L.marker([4.7110, -74.0721], {icon: hubIcon}).addTo(map).bindPopup('<b>Hub Bogotá (Sabana)</b>');
                    L.marker([6.2442, -75.5812], {icon: hubIcon}).addTo(map).bindPopup('<b>Hub Medellín</b>');

                    [[5.5353, -73.3678], [4.8133, -75.6961], [2.4382, -76.6132], [4.1420, -73.6266]].forEach(pos => L.marker(pos, {icon: agroIcon}).addTo(map));
                    [[[4.5339, -75.6811], [4.7110, -74.0721]], [[4.5339, -75.6811], [3.4516, -76.5320]], [[4.5339, -75.6811], [6.2442, -75.5812]], [[5.5353, -73.3678], [4.7110, -74.0721]]].forEach(route => L.polyline(route, {color: '#0ea5e9', weight: 3, dashArray: '5, 10', opacity: 0.7}).addTo(map));
                    mapRef.current = map;
                }
                return () => { if(mapRef.current) { mapRef.current.remove(); mapRef.current = null; } };
            }, []);
            return <div id="map-container" className="shadow-inner border border-slate-200"></div>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('inicio');
            const [activeZone, setActiveZone] = useState('frio');

            // Array de navegación completo
            const navTabs = [
                { id: 'inicio', label: 'Inicio', icon: 'fa-house' },
                { id: 'marca', label: 'Marca', icon: 'fa-palette' },
                { id: 'admin', label: 'Admin', icon: 'fa-bullseye' },
                { id: 'tecnico', label: 'Técnico', icon: 'fa-gears' },
                { id: 'red', label: 'Red Col', icon: 'fa-map-location-dot' },
                { id: 'comercial', label: 'Comercial', icon: 'fa-chart-line' },
                { id: 'financiero', label: 'Financiero', icon: 'fa-sack-dollar' },
                { id: 'legal', label: 'Legal', icon: 'fa-scale-balanced' },
                { id: 'canvas', label: 'Canvas', icon: 'fa-table-cells-large' }
            ];

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header Navegación */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-50">
                        <div className="max-w-[1500px] mx-auto px-4 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3 cursor-pointer flex-shrink-0 mr-4" onClick={() => setActiveTab('inicio')}>
                                <Logo />
                                <div><h1 className="text-xl md:text-2xl font-black text-slate-800 leading-none">Fresh<span className="text-green-500">Route</span></h1></div>
                            </div>
                            
                            {/* Scrollable Nav para TODAS las pestañas */}
                            <div className="flex gap-2 overflow-x-auto no-scrollbar py-2 w-full justify-start md:justify-end">
                                {navTabs.map(t => (
                                    <button 
                                        key={t.id} 
                                        onClick={() => setActiveTab(t.id)} 
                                        className={`px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap transition-all flex items-center ${activeTab === t.id ? 'bg-green-100 text-green-700 shadow-sm' : 'bg-slate-50 text-slate-500 hover:bg-slate-100'}`}
                                    >
                                        <i className={`fa-solid ${t.icon} mr-2`}></i> {t.label}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow p-4 md:p-8 max-w-[1400px] mx-auto w-full">
                        
                        {/* 0. INICIO */}
                        {activeTab === 'inicio' && (
                            <div className="animate-slide-up">
                                <div className="bg-slate-800 rounded-[2rem] p-10 lg:p-16 text-white relative overflow-hidden shadow-2xl mb-8">
                                    <div className="absolute right-0 top-0 opacity-10 transform translate-x-1/4 -translate-y-1/4 scale-150"><Logo /></div>
                                    <div className="relative z-10 max-w-2xl">
                                        <h2 className="text-4xl md:text-6xl font-black mb-6 leading-tight">La ruta inteligente del <span className="text-green-500">agro al retail.</span></h2>
                                        <p className="text-slate-300 text-lg mb-10">Conectamos el campo con la ciudad utilizando algoritmos predictivos y control de temperatura IoT. Explora todas las secciones del menú para conocer el Plan de Negocios Maestro completo.</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 1. IDENTIDAD Y MARCA */}
                        {activeTab === 'marca' && (
                            <div className="animate-fade-in"><h2 className="text-3xl font-black text-slate-800 mb-6">Identidad de Marca y Colores</h2>
                                <div className="grid lg:grid-cols-12 gap-8 mb-8">
                                    <div className="lg:col-span-5 bg-white p-8 rounded-3xl border border-slate-200 text-center"><div className="transform scale-150 mb-10 mt-6"><Logo /></div><h3 className="text-2xl font-black mb-4">El Isotipo</h3><p className="text-slate-600 text-sm">Fusión de la frescura del campo y eficiencia logística.</p></div>
                                    <div className="lg:col-span-7 bg-white p-8 rounded-3xl border border-slate-200"><h3 className="text-2xl font-black mb-6"><i className="fa-solid fa-palette text-pink-500"></i> Paleta Corporativa</h3><div className="grid sm:grid-cols-2 gap-6">{BRAND_COLORS.map((c, i) => (<div key={i}><div className={`color-swatch ${c.class}`}></div><h4 className="font-bold">{c.name}</h4><p className="text-xs text-slate-600">{c.text}</p></div>))}</div></div>
                                </div>
                            </div>
                        )}

                        {/* 2. ESTUDIO ADMINISTRATIVO */}
                        {activeTab === 'admin' && (

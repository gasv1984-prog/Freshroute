
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshRoute - Proyecto Maestro Total</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS y JS (Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .gradient-text { background: linear-gradient(135deg, #22c55e, #0ea5e9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Animaciones */
        @keyframes slideInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideInUp 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }

        /* Croquis Styles */
        .croquis-container { display: grid; grid-template-columns: 1.5fr 2fr 1.5fr; grid-template-rows: 150px 150px; gap: 12px; background: #e2e8f0; padding: 12px; border-radius: 16px; }
        .zone-btn { background: white; border: 2px solid transparent; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .zone-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .zone-btn.active { border-color: #22c55e; background: #f0fdf4; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2); }
        .zone-recepcion { grid-row: 1 / 3; } .zone-calidad { grid-column: 2 / 3; grid-row: 1 / 2; } .zone-frio { grid-column: 2 / 3; grid-row: 2 / 3; } .zone-despacho { grid-column: 3 / 4; grid-row: 1 / 3; } .zone-control { grid-column: 1 / 4; grid-row: 3 / 4; height: 80px; margin-top: 4px;}

        /* Canvas Styles */
        .canvas-box { background: white; border: 2px solid #e2e8f0; border-radius: 12px; padding: 16px; transition: all 0.2s; height: 100%; display: flex; flex-direction: column;}
        .canvas-box:hover { border-color: #22c55e; box-shadow: 0 10px 15px -3px rgba(34,197,94,0.1); transform: translateY(-2px); }
        .canvas-header { display: flex; align-items: center; gap: 8px; font-weight: 800; color: #1e293b; margin-bottom: 12px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
        .canvas-list { list-style: none; padding: 0; margin: 0; font-size: 0.85rem; color: #475569; }
        .canvas-list li { margin-bottom: 8px; padding-left: 16px; position: relative; }
        .canvas-list li::before { content: '•'; position: absolute; left: 0; color: #22c55e; font-weight: bold; }

        /* Mapa Leaflet */
        #map-container { height: 450px; width: 100%; border-radius: 1rem; z-index: 10; }
        .custom-div-icon { background: transparent; border: none; }

        /* Colors Palettes */
        .color-swatch { width: 100%; height: 80px; border-radius: 12px; margin-bottom: 10px; box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.06); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
    <script>
        tailwind.config = { theme: { extend: { colors: { fresh: { green: '#22c55e', dark: '#0f172a', cyan: '#06b6d4', orange: '#f97316' } } } } }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ================= DATOS DEL PROYECTO =================

        const BRAND_COLORS = [
            { name: 'Fresh Green', hex: '#22C55E', class: 'bg-[#22C55E]', text: 'Color principal. Simboliza el campo, la agricultura, la frescura de los alimentos y la sostenibilidad.' },
            { name: 'Tech Slate', hex: '#0F172A', class: 'bg-[#0F172A]', text: 'Color corporativo y tipográfico. Aporta seriedad, profesionalismo y seguridad B2B.' },
            { name: 'Cold Cyan', hex: '#06B6D4', class: 'bg-[#06B6D4]', text: 'Color de apoyo. Representa directamente la cadena de frío y la refrigeración.' },
            { name: 'Alert Orange', hex: '#F97316', class: 'bg-[#F97316]', text: 'Color de acento. Usado para dinamismo y alertas térmicas en el dashboard.' }
        ];

        const BRAND_IDENTITY = [
            { title: 'Tono de Comunicación', icon: 'fa-bullhorn', desc: 'Profesional, seguro, tecnológico pero accesible. Le hablamos a corporaciones con métricas de eficiencia, y a agricultores con empatía y claridad.' },
            { title: 'Slogan / Tagline', icon: 'fa-quote-left', desc: '"La ruta inteligente del agro al retail" - Resume perfectamente la conexión entre el origen, la inteligencia artificial y el destino.' },
            { title: 'Tipografía Corporativa', icon: 'fa-font', desc: 'Familia "Inter". Una fuente sans-serif moderna, altamente legible en pantallas y dashboards móviles, ideal para interfaces de usuario.' }
        ];

        const ADMIN_DATA = [
            { id: 'mision', icon: 'fa-bullseye', color: 'text-blue-500', bg: 'bg-blue-50', title: 'Misión', detail: 'Nuestra misión es revolucionar la cadena de suministro agroalimentaria. Utilizamos algoritmos avanzados de ruteo dinámico y telemetría IoT para garantizar que los alimentos frescos lleguen a su destino en el menor tiempo posible.' },
            { id: 'vision', icon: 'fa-eye', color: 'text-indigo-500', bg: 'bg-indigo-50', title: 'Visión', detail: 'Para el año 2030, FreshRoute será la plataforma logística e infraestructura tecnológica estándar en la distribución de alimentos perecederos en toda la región, promoviendo una economía circular.' },
            { id: 'valores', icon: 'fa-heart', color: 'text-red-500', bg: 'bg-red-50', title: 'Valores', detail: '• Innovación: No nos conformamos, codificamos soluciones.\n• Calidad: Respeto estricto por la cadena de frío.\n• Sostenibilidad: Reducción en la huella de carbono.\n• Transparencia: Visibilidad 100% en tiempo real.' },
            { id: 'politicas', icon: 'fa-shield-halved', color: 'text-emerald-500', bg: 'bg-emerald-50', title: 'Políticas', detail: '1. Frío Ininterrumpido: Tolerancia cero a variaciones térmicas.\n2. Comercio Justo: Eliminación de intermediarios especulativos.\n3. Zero Waste: Protocolo automático de donación a bancos.' },
            { id: 'objetivos', icon: 'fa-flag-checkered', color: 'text-orange-500', bg: 'bg-orange-50', title: 'Objetivos', detail: '• Reducir tiempos de entrega (Lead Time) en un 25%.\n• Mantener índice de rechazo por frío debajo del 0.8%.\n• Integrar 150 productores locales en 12 meses.' }
        ];

        const TECH_CONTEXT = [
            { id: 'loc', title: 'Localización', icon: 'fa-map-location-dot', text: 'Anillo perimetral logístico. Acceso directo a carreteras troncales para entrada de camiones agro y distribución ágil urbana.' },
            { id: 'socio', title: 'Socioeconómico', icon: 'fa-people-group', text: 'Generación de 50+ empleos (conductores, IT) y mejora del 15% en los márgenes de los agricultores al eliminar intermediarios.' },
            { id: 'infra', title: 'Infraestructura', icon: 'fa-building', text: 'Nave de 1,200 m² con subestación propia y UPS industrial. Red Wi-Fi 6 en toda la planta para comunicación de sensores IoT.' }
        ];

        const ZONES_DATA = {
            recepcion: { name: '1. Muelles de Recepción', icon: 'fa-truck-ramp-box', color: 'text-emerald-600', temp: 'Ambiente (15°C)', equip: 'Rampas hidráulicas, Básculas de piso.', desc: 'Punto de llegada de camiones.' },
            calidad: { name: '2. Clasificación y Calidad', icon: 'fa-clipboard-check', color: 'text-blue-600', temp: 'Refrigerado (10°C)', equip: 'Mesas INOX, Termómetros láser.', desc: 'Asignación de códigos QR.' },
            frio: { name: '3. Cuartos Fríos (Stock)', icon: 'fa-snowflake', color: 'text-cyan-600', temp: 'Frío Profundo (2°C - 6°C)', equip: 'Estanterías Drive-in, Sensores IoT.', desc: 'Cross-docking de alta rotación.' },
            despacho: { name: '4. Muelles de Despacho', icon: 'fa-truck-fast', color: 'text-orange-600', temp: 'Refrigerado (8°C)', equip: 'Sellos inflables, Apiladores.', desc: 'Carga de la flota ligera.' },
            control: { name: '5. Centro de Control', icon: 'fa-server', color: 'text-purple-600', temp: 'Climatizado IT (20°C)', equip: 'Video Wall, Servidores Edge Computing.', desc: 'Monitoreo GPS y alertas IA.' }
        };

        const MAQUINARIA_DATA = [
            { tipo: 'Primera Milla', icon: 'fa-truck', title: 'Camiones Pesados', specs: ['5 a 8 Toneladas.', 'Furgón Isotérmico.', 'Refrigeración Thermo King.'] },
            { tipo: 'Última Milla', icon: 'fa-van-shuttle', title: 'Vans Ligeras', specs: ['1 a 2 Toneladas.', 'Refrigeración acoplada al motor.'] },
            { tipo: 'Intralogística', icon: 'fa-pallet', title: 'Equipos Elevación', specs: ['Montacargas Eléctricos.', 'Apiladores Reach Trucks.'] },
            { tipo: 'Hardware/IoT', icon: 'fa-microchip', title: 'Ecosistema Tech', specs: ['Dataloggers IoT 5G.', 'GPS integrados (OBD2).'] }
        ];

        const COMERCIAL_DATA = [
            { id: 'segmentacion', title: 'Segmentación', icon: 'fa-users-viewfinder', color: 'text-blue-500', bg: 'bg-blue-50', text: 'B2B: Productores Agrícolas (sin logística), Supermercados (Retail) y sector HORECA.' },
            { id: 'tamano', title: 'Tamaño del Mercado', icon: 'fa-chart-pie', color: 'text-indigo-500', bg: 'bg-indigo-50', text: 'Océano Azul: Sector donde se pierde hasta un 30% de alimentos frescos por ineficiencias.' },
            { id: 'competencia', title: 'Competencia', icon: 'fa-chess-knight', color: 'text-red-500', bg: 'bg-red-50', text: 'Transporte informal sin refrigeración y operadores tradicionales no especializados en perecederos.' },
            { id: 'tendencias', title: 'Tendencias', icon: 'fa-arrow-trend-up', color: 'text-orange-500', bg: 'bg-orange-50', text: 'Consumo consciente, trazabilidad "Farm to Fork", digitalización del agro e impacto ESG.' },
            { id: 'posicionamiento', title: 'Posicionamiento', icon: 'fa-crosshairs', color: 'text-emerald-500', bg: 'bg-emerald-50', text: 'Nos posicionamos como el "Socio Tecnológico Transparente". Garantizamos la calidad total.' },
            { id: 'canales', title: 'Distribución', icon: 'fa-network-wired', color: 'text-cyan-500', bg: 'bg-cyan-50', text: 'Venta B2B directa. Presencia en ferias (Agroexpo). App Móvil (Productores) y Web (Retail).' },
            { id: 'precio', title: 'Precio', icon: 'fa-tags', color: 'text-purple-500', bg: 'bg-purple-50', text: 'Modelo Híbrido: Tarifa por volumen/km + Modelo Suscripción (SaaS) premium para analítica.' }
        ];

        // NUEVO: DATOS DEL ESTUDIO AMBIENTAL
        const AMBIENTAL_DATA = [
            { id: 'impacto', title: 'Impacto Ambiental', icon: 'fa-earth-americas', color: 'text-teal-600', bg: 'bg-teal-50', text: 'El impacto neto de FreshRoute es altamente positivo. Al optimizar las rutas y garantizar la cadena de frío, evitamos que miles de toneladas de comida se pudran (la descomposición de alimentos genera metano, un gas de efecto invernadero 25 veces más potente que el CO2). El impacto de nuestra flota se mitiga con Eco-Routing.' },
            { id: 'aspectos', title: 'Aspectos Ambientales', icon: 'fa-smog', color: 'text-slate-600', bg: 'bg-slate-100', text: 'Nuestros procesos interactúan con el ambiente mediante: el consumo de combustibles fósiles de los camiones pesados, el consumo de energía eléctrica del centro de acopio (cuartos fríos) y el manejo de los gases refrigerantes industriales.' },
            { id: 'normativo', title: 'Cumplimiento Normativo', icon: 'fa-scale-balanced', color: 'text-amber-600', bg: 'bg-amber-50', text: 'Cumplimos con las normativas del Ministerio de Ambiente y Desarrollo Sostenible de Colombia. Todos nuestros vehículos pesados operan bajo estándares de emisiones Euro V / Euro VI. Además, empleamos refrigerantes ecológicos de bajo PCG (Potencial de Calentamiento Global).' },
            { id: 'objetivos', title: 'Objetivos Ambientales', icon: 'fa-crosshairs', color: 'text-rose-600', bg: 'bg-rose-50', text: '1. Reducir la huella de carbono por tonelada transportada en un 15% cada año.\n2. Asegurar que el 0% de los alimentos aptos terminen en rellenos sanitarios.\n3. Lograr que el 30% del consumo energético del Hub Logístico provenga de paneles solares para el año 2028.' },
            { id: 'estrategias', title: 'Estrategias de Sostenibilidad', icon: 'fa-leaf', color: 'text-green-600', bg: 'bg-green-50', text: 'Implementamos "Eco-Routing" en nuestro algoritmo (rutas que consumen menos diésel). Promovemos la Economía Circular donando excedentes a Bancos de Alimentos y convirtiendo las mermas no aptas para consumo humano en abono orgánico (Compostaje). Transición progresiva a vanes 100% eléctricas para la última milla.' }
        ];

        // ================= COMPONENTES =================

        const Logo = () => (
            <svg className="w-10 h-10 md:w-12 md:h-12" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <g id="vegetables"><circle cx="45" cy="70" r="25" fill="#ef4444" /><path d="M45 45 C55 45 55 55 45 55 C35 55 35 45 45 45 Z" fill="#22c55e" /><path d="M45 45 C45 35 35 35 35 45 C35 55 45 55 45 45 Z" fill="#22c55e" /><path d="M65 30 Q105 40 100 80 Q90 105 65 30 Z" fill="#f97316" transform="rotate(20, 85, 55)" /></g>
                <path fill="none" stroke="white" strokeWidth="12" strokeLinecap="round" strokeLinejoin="round" d="M10 85 L 45 55 L 75 75 L 110 30" />
                <path fill="none" stroke="white" strokeWidth="12" strokeLinecap="round" strokeLinejoin="round" d="M85 30 L 110 30 L 110 55" />
                <path fill="none" stroke="#0f172a" strokeWidth="6" strokeLinecap="round" strokeLinejoin="round" d="M10 85 L 45 55 L 75 75 L 110 30" />
                <path fill="none" stroke="#0f172a" strokeWidth="6" strokeLinecap="round" strokeLinejoin="round" d="M85 30 L 110 30 L 110 55" />
            </svg>
        );

        const MapComponent = () => {
            useEffect(() => {
                const map = L.map('map-container').setView([4.5709, -74.2973], 6);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);

                const hubIcon = L.divIcon({ html: '<div class="w-8 h-8 bg-fresh-dark text-white rounded-full flex items-center justify-center shadow-lg"><i class="fa-solid fa-building"></i></div>', className: 'custom-div-icon', iconSize: [32, 32], iconAnchor: [16, 16] });
                const agroIcon = L.divIcon({ html: '<div class="w-6 h-6 bg-fresh-green text-white rounded-full flex items-center justify-center shadow-md text-xs"><i class="fa-solid fa-leaf"></i></div>', className: 'custom-div-icon', iconSize: [24, 24], iconAnchor: [12, 12] });

                L.marker([4.5339, -75.6811], {icon: hubIcon}).addTo(map).bindPopup('<b>Hub Central Quindío</b>');
                L.marker([4.7110, -74.0721], {icon: hubIcon}).addTo(map).bindPopup('<b>Hub Bogotá (Sabana)</b>');
                L.marker([6.2442, -75.5812], {icon: hubIcon}).addTo(map).bindPopup('<b>Hub Medellín</b>');

                [[5.5353, -73.3678], [4.8133, -75.6961], [2.4382, -76.6132], [4.1420, -73.6266]].forEach(pos => L.marker(pos, {icon: agroIcon}).addTo(map));
                [[[4.5339, -75.6811], [4.7110, -74.0721]], [[4.5339, -75.6811], [3.4516, -76.5320]], [[4.5339, -75.6811], [6.2442, -75.5812]], [[5.5353, -73.3678], [4.7110, -74.0721]]].forEach(route => L.polyline(route, {color: '#0ea5e9', weight: 3, dashArray: '5, 10', opacity: 0.7}).addTo(map));
                
                return () => map.remove();
            }, []);
            return <div id="map-container" className="shadow-inner border border-slate-200"></div>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('inicio');
            const [activeZone, setActiveZone] = useState('frio');

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header Navegación */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-50">
                        <div className="max-w-[1400px] mx-auto px-4 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('inicio')}>
                                <Logo />
                                <div><h1 className="text-xl md:text-2xl font-black text-slate-800 leading-none">Fresh<span className="text-green-500">Route</span></h1></div>
                            </div>
                            
                            {/* Scrollable Nav */}
                            <div className="flex gap-2 overflow-x-auto no-scrollbar py-2 max-w-[65%]">
                                {[
                                    { id: 'inicio', label: 'Inicio', icon: 'fa-house' },
                                    { id: 'admin', label: 'E. Admin', icon: 'fa-bullseye' },
                                    { id: 'tecnico', label: 'E. Técnico', icon: 'fa-gears' },
                                    { id: 'red', label: 'Red Col', icon: 'fa-map-location-dot' },
                                    { id: 'comercial', label: 'E. Comercial', icon: 'fa-chart-line' },
                                    { id: 'ambiental', label: 'E. Ambiental', icon: 'fa-tree' }, // NUEVA PESTAÑA
                                    { id: 'canvas', label: 'Canvas', icon: 'fa-table-cells-large' },
                                    { id: 'marca', label: 'Marca', icon: 'fa-palette' }
                                ].map(t => (
                                    <button 
                                        key={t.id} 
                                        onClick={() => setActiveTab(t.id)} 
                                        className={`px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap transition-all ${activeTab === t.id ? 'bg-green-100 text-green-700 shadow-sm' : 'bg-slate-50 text-slate-500 hover:bg-slate-100'}`}
                                    >
                                        <i className={`fa-solid ${t.icon} mr-1`}></i> <span className="hidden md:inline">{t.label}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow p-4 md:p-8 max-w-[1400px] mx-auto w-full">
                        
                        {/* 1. INICIO (DASHBOARD) */}
                        {activeTab === 'inicio' && (
                            <div className="animate-slide-up">
                                <div className="bg-slate-800 rounded-[2rem] p-10 lg:p-16 text-white relative overflow-hidden shadow-2xl mb-8">
                                    <div className="absolute right-0 top-0 opacity-10 transform translate-x-1/4 -translate-y-1/4 scale-150"><Logo /></div>
                                    <div className="relative z-10 max-w-2xl">
                                        <h2 className="text-4xl md:text-6xl font-black mb-6 leading-tight">La ruta inteligente del <span className="text-green-500">agro al retail.</span></h2>
                                        <p className="text-slate-300 text-lg mb-10">Conectamos el campo con la ciudad utilizando algoritmos predictivos y control de temperatura IoT. Explora el menú superior para conocer el Proyecto Maestro de FreshRoute.</p>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-white p-6 rounded-3xl border border-slate-200 flex items-center gap-4"><div className="bg-blue-50 text-blue-500 w-12 h-12 rounded-xl flex items-center justify-center text-xl"><i className="fa-solid fa-route"></i></div><div><p className="text-xs font-bold text-slate-400 uppercase">Rutas Algorítmicas</p><p className="text-2xl font-black text-slate-800">142</p></div></div>
                                    <div className="bg-white p-6 rounded-3xl border border-slate-200 flex items-center gap-4"><div className="bg-red-50 text-red-500 w-12 h-12 rounded-xl flex items-center justify-center text-xl"><i className="fa-solid fa-temperature-arrow-down"></i></div><div><p className="text-xs font-bold text-slate-400 uppercase">Alertas Térmicas</p><p className="text-2xl font-black text-slate-800">0</p></div></div>
                                    <div className="bg-white p-6 rounded-3xl border border-slate-200 flex items-center gap-4"><div className="bg-orange-50 text-orange-500 w-12 h-12 rounded-xl flex items-center justify-center text-xl"><i className="fa-solid fa-leaf"></i></div><div><p className="text-xs font-bold text-slate-400 uppercase">Tasa Desperdicio</p><p className="text-2xl font-black text-green-500">&lt; 0.5%</p></div></div>
                                </div>
                            </div>
                        )}

                        {/* 2. ESTUDIO ADMINISTRATIVO */}
                        {activeTab === 'admin' && (
                            <div className="animate-fade-in">
                                <h2 className="text-3xl font-black text-slate-800 mb-6">Estudio Administrativo</h2>
                                <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {ADMIN_DATA.map(item => (
                                        <div key={item.id} className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                                            <div className="flex items-center gap-3 mb-4"><div className={`w-12 h-12 rounded-xl flex items-center justify-center text-xl ${item.bg} ${item.color}`}><i className={`fa-solid ${item.icon}`}></i></div><h3 className="text-xl font-bold text-slate-800">{item.title}</h3></div>
                                            <p className="text-slate-600 text-sm whitespace-pre-line leading-relaxed">{item.detail}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 3. ESTUDIO TÉCNICO */}
                        {activeTab === 'tecnico' && (
                            <div className="animate-fade-in space-y-8">
                                <h2 className="text-3xl font-black text-slate-800">Estudio Técnico, Planta y Flota</h2>
                                <div className="grid md:grid-cols-3 gap-6">
                                    {TECH_CONTEXT.map(ctx => (
                                        <div key={ctx.id} className="bg-white p-6 rounded-2xl border border-slate-200"><h4 className="font-bold text-slate-800 mb-2"><i className={`fa-solid ${ctx.icon} text-blue-500 mr-2`}></i>{ctx.title}</h4><p className="text-sm text-slate-600">{ctx.text}</p></div>
                                    ))}
